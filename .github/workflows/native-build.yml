name: Native clone and build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            preset: windows-native
            executable: out/native-Windows/Release/indago.exe
          - os: ubuntu-24.04
            preset: linux-native
            executable: out/native-Linux/indago
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive
          lfs: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Linux prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build libssl-dev pkg-config
      - run: cmake --preset ${{ matrix.preset }}
      - run: cmake --build --preset ${{ matrix.preset }} --parallel 2
      - name: CLI smoke check (no target execution)
        timeout-minutes: 3
        shell: pwsh
        run: |
          ./tests/native_clone_smoke.ps1 -Executable '${{ matrix.executable }}'
